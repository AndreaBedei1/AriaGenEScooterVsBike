# =============================================================================
# AriaGenEScooterVsBike - analysis taxonomy
# =============================================================================
# Controlled vocabularies used by annotations, synthetic data and metrics.
# Names are stable identifiers (snake_case): never rename a class once real
# data have been annotated - add a new class and document the change instead.
#
# These definitions are DRAFT operational definitions. They must be refined
# (with examples and edge cases) in an annotation guide before the pilot, and
# inter-annotator agreement must be checked on a subset of recordings.
# =============================================================================
taxonomy_version: 1

# -----------------------------------------------------------------------------
# Infrastructure classes of a ROUTE SEGMENT (main unit of analysis).
# A route segment is a semantically homogeneous stretch of the ride. Exactly
# one class per segment; segments must not overlap in time.
# -----------------------------------------------------------------------------
infrastructure_classes:
  protected_cycle_path: >-
    Cycle path physically separated from motor traffic (kerb, barrier,
    verge or parking row) and not shared with pedestrians.
  painted_cycle_lane: >-
    Cycle lane on the carriageway, separated from motor traffic by road
    markings only.
  shared_pedestrian_cycle_path: >-
    Path legally or de facto shared by pedestrians and cyclists/e-scooters,
    without separation between the two flows.
  road_shared_with_traffic: >-
    Carriageway shared with motor vehicles, without a dedicated cycling
    facility.
  pedestrian_or_shared_space: >-
    Pedestrian area, plaza or shared space where riding is permitted, usually
    with reduced speed.
  crossing: >-
    Pedestrian and/or cycle crossing traversed by the rider (zebra or cycle
    crossing), from entry to exit of the crossing area.
  intersection: >-
    Junction of two or more roads or paths (signalised or not), excluding
    roundabouts, from entry to exit of the junction area.
  roundabout: >-
    Roundabout, from entry (yield line) to exit of the circulating
    carriageway.
  other: >-
    Identified infrastructure not covered by the classes above (describe it
    in the segment notes).
  unknown: >-
    Infrastructure cannot be determined (e.g. video unavailable).

# -----------------------------------------------------------------------------
# Event / interaction types. Events are time intervals that may OVERLAP each
# other and any route segment (e.g. protected_cycle_path + pedestrian_interaction).
# Neutral terms only: no event is labelled "hazard" or "near miss" unless a
# validated definition is adopted by the study.
# -----------------------------------------------------------------------------
event_types:
  pedestrian_interaction: >-
    A pedestrian is relevant to the rider's path (crossing, walking ahead,
    entering or leaving the path).
  cyclist_interaction: >-
    A cyclist is relevant to the rider's path (oncoming, overtaking, being
    overtaken, crossing).
  escooter_interaction: >-
    Another e-scooter rider is relevant to the rider's path.
  vehicle_interaction: >-
    A moving motor vehicle (car, motorcycle, van, truck, bus) is relevant to
    the rider's path.
  crossing: >-
    The rider negotiates a pedestrian/cycle crossing (approach, possible
    stop, traversal).
  intersection: >-
    The rider negotiates an intersection (approach, possible stop,
    traversal).
  roundabout: >-
    The rider negotiates a roundabout (approach, entry, circulation, exit).
  parked_vehicle: >-
    A parked or stationary vehicle affects the rider's path or visibility.
  obstacle: >-
    A static object or surface defect on or near the path (bollard, bin,
    works, pothole) affects the rider.
  narrow_section: >-
    The available path width is reduced (works, parked objects, narrow
    passage).
  overtaking: >-
    Overtaking manoeuvre involving the rider (rider overtakes or is
    overtaken); usually combined with another interaction type via tags.
  stopping: >-
    The rider comes to a stop (traffic light, yielding, congestion).
  other_interaction: >-
    Any other relevant interaction (describe it in the event notes).

# -----------------------------------------------------------------------------
# Semantic classes of the scene (pixel/object level), used by segmentation
# back-ends and by the semantic gaze module. Ids must be 0..N-1, unique; new
# classes are appended (never renumbered). Back-end specific labels are mapped
# onto these names by mapping files (configs/label_mappings/).
#
# The taxonomy is HIERARCHICAL: every class has a parent category (level 1).
# Analyses can be run at class level or at category level; a model that cannot
# separate two classes reliably (e.g. cycle lane vs carriageway) must map both
# to the parent-level fallback class (e.g. path_surface_unspecified) or to
# unknown - never to a guessed class. "unknown" is used for void, uncertain,
# unlabelled or off-image gaze targets.
# -----------------------------------------------------------------------------
semantic_categories:
  path_surface: "Surfaces on which people move: carriageway, cycle lane/path, sidewalk, crossing, curb."
  road_user: "People and vehicles, moving or parked."
  traffic_control: "Signs and signals."
  street_element: "Static objects on or near the path: obstacles and infrastructure elements."
  surroundings: "Background: vegetation, buildings, sky, other."
  unknown: "Unlabelled, void or uncertain."

semantic_classes:
  - {id: 0, name: unknown, parent: unknown, description: "Unlabelled, void or uncertain region."}
  - {id: 1, name: road, parent: path_surface, description: "Carriageway for motor traffic."}
  - {id: 2, name: cycle_lane, parent: path_surface, description: "Cycle lane or cycle path surface."}
  - {id: 3, name: sidewalk, parent: path_surface, description: "Sidewalk / pedestrian surface."}
  - {id: 4, name: crossing, parent: path_surface, description: "Zebra or cycle crossing markings/area."}
  - {id: 5, name: curb, parent: path_surface, description: "Kerb or curb cut."}
  - {id: 6, name: pedestrian, parent: road_user, description: "Person on foot."}
  - {id: 7, name: cyclist, parent: road_user, description: "Person riding a bicycle."}
  - {id: 8, name: bicycle, parent: road_user, description: "Bicycle (ridden or parked)."}
  - {id: 9, name: escooter, parent: road_user, description: "E-scooter and/or its rider (rider vs vehicle split is TBD)."}
  - {id: 10, name: motorcycle, parent: road_user, description: "Motorcycle or moped."}
  - {id: 11, name: car, parent: road_user, description: "Passenger car."}
  - {id: 12, name: large_vehicle, parent: road_user, description: "Van, truck or bus, when distinguishable."}
  - {id: 13, name: parked_vehicle, parent: road_user, description: "Stationary/parked vehicle (needs temporal reasoning; single-frame models usually output car)."}
  - {id: 14, name: traffic_sign, parent: traffic_control, description: "Traffic sign."}
  - {id: 15, name: traffic_light, parent: traffic_control, description: "Traffic light."}
  - {id: 16, name: obstacle, parent: street_element, description: "Static object on or near the path (bollard, bin, works barrier)."}
  - {id: 17, name: vegetation, parent: surroundings, description: "Trees, hedges, grass, terrain."}
  - {id: 18, name: building, parent: surroundings, description: "Buildings and walls of buildings."}
  - {id: 19, name: sky, parent: surroundings, description: "Sky."}
  - {id: 20, name: other, parent: surroundings, description: "Known class not listed above (wall, building parts, animals, ...)."}
  - {id: 21, name: path_surface_unspecified, parent: path_surface, description: "Path surface whose type (carriageway / cycle lane / sidewalk) cannot be determined reliably."}
  - {id: 22, name: infrastructure_element, parent: street_element, description: "Pole, street light, bollard, fence, guard rail, bike rack, bench, kiosk and similar fixed elements."}
  - {id: 23, name: other_vehicle, parent: road_user, description: "Vehicle not covered by the classes above (tram, caravan, trailer, unknown vehicle type)."}

# Groups used for aggregated gaze metrics (a class may belong to several groups).
semantic_groups:
  pedestrians: [pedestrian]
  other_vulnerable_road_users: [cyclist, bicycle, escooter]
  vehicles: [motorcycle, car, large_vehicle, parked_vehicle, other_vehicle]
  path_surface: [road, cycle_lane, sidewalk, crossing, curb, path_surface_unspecified]
  traffic_control: [traffic_sign, traffic_light]
  infrastructure: [road, cycle_lane, sidewalk, crossing, curb, path_surface_unspecified, traffic_sign, traffic_light, infrastructure_element]
  obstacles: [obstacle]
  street_elements: [obstacle, infrastructure_element]
  surroundings: [vegetation, building, sky, other]
