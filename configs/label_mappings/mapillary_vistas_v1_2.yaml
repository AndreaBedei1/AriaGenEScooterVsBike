# Mapping: Mapillary Vistas v1.2 (65 classes, as in the id2label of the Hugging Face
# checkpoint facebook/mask2former-swin-large-mapillary-vistas-semantic, verified
# 2026-10) -> project semantic classes (configs/taxonomy.yaml).
#
# STATUS: provisional, not validated on Aria imagery. Entries marked
# "provisional" have no verified official definition or are ambiguous.
# Licence note: Mapillary Vistas is released for research / non-commercial use
# (CC BY-NC-SA); check the terms before any commercial use of models or outputs.
backend: mask2former-swin-large-mapillary-vistas-semantic
default: unknown
map:
