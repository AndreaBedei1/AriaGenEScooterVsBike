  "Parking": road
  "Pedestrian Area": sidewalk
  "Rail Track": other
  "Road": road
  "Service Lane": road
  "Sidewalk": sidewalk
  "Bridge": other
  "Building": building
  "Tunnel": other
  "Person": pedestrian
  "Bicyclist": cyclist
  "Motorcyclist": motorcycle
  "Other Rider": escooter          # provisional: closest class; official definition unverified
  "Lane Marking - Crosswalk": crossing
  "Lane Marking - General": road
  "Mountain": other
  "Sand": other
  "Sky": sky
  "Snow": other
  "Terrain": vegetation
  "Vegetation": vegetation
  "Water": other
  "Banner": other
  "Bench": other
