# Mapping: Mapillary Vistas v1.2 (65 classes, as in the id2label of the Hugging Face
# checkpoint facebook/mask2former-swin-large-mapillary-vistas-semantic, verified
# 2026-10) -> project semantic classes (configs/taxonomy.yaml).
#
# STATUS: provisional, not validated on Aria imagery. Entries marked
# "provisional" have no verified official definition or are ambiguous.
# Classes the model cannot separate reliably on Aria imagery must be remapped to
# the parent fallback (e.g. path_surface_unspecified) after the CV benchmark.
# Licence note: Mapillary Vistas is released for research / non-commercial use
# (CC BY-NC-SA); check the terms before any commercial use of models or outputs.
backend: mask2former-swin-large-mapillary-vistas-semantic
default: unknown
map:
  "Bird": other
  "Ground Animal": other
  "Curb": curb
  "Fence": infrastructure_element
  "Guard Rail": infrastructure_element
  "Barrier": obstacle
  "Wall": other
  "Bike Lane": cycle_lane
  "Crosswalk - Plain": crossing
  "Curb Cut": curb
  "Parking": road
  "Pedestrian Area": sidewalk
  "Rail Track": other
  "Road": road
  "Service Lane": road
  "Sidewalk": sidewalk
  "Bridge": other
  "Building": building
  "Tunnel": other
  "Person": pedestrian
  "Bicyclist": cyclist
  "Motorcyclist": motorcycle
  "Other Rider": escooter          # provisional: closest class; official definition unverified
  "Lane Marking - Crosswalk": crossing
  "Lane Marking - General": road
  "Mountain": other
  "Sand": other
  "Sky": sky
  "Snow": other
  "Terrain": vegetation
  "Vegetation": vegetation
  "Water": other
  "Banner": other
  "Bench": infrastructure_element
  "Bike Rack": infrastructure_element
  "Billboard": infrastructure_element
  "Catch Basin": road
  "CCTV Camera": infrastructure_element
  "Fire Hydrant": infrastructure_element
  "Junction Box": infrastructure_element
  "Mailbox": infrastructure_element
  "Manhole": road
  "Phone Booth": infrastructure_element
  "Pothole": obstacle
  "Street Light": infrastructure_element
  "Pole": infrastructure_element
  "Traffic Sign Frame": traffic_sign
  "Utility Pole": infrastructure_element
  "Traffic Light": traffic_light
  "Traffic Sign (Back)": traffic_sign
  "Traffic Sign (Front)": traffic_sign
  "Trash Can": obstacle
  "Bicycle": bicycle
  "Boat": other
  "Bus": large_vehicle
  "Car": car                       # parked vs moving needs temporal reasoning (planned)
  "Caravan": other_vehicle
  "Motorcycle": motorcycle
  "On Rails": other_vehicle        # trams / trains
  "Other Vehicle": other_vehicle   # provisional
  "Trailer": other_vehicle
  "Truck": large_vehicle
  "Wheeled Slow": other            # provisional: definition unverified (may include scooters)
  "Car Mount": other
  "Ego Vehicle": unknown           # handlebar / own vehicle in view: excluded from scene classes
